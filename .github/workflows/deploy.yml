name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push doesn't cancel one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browsers for the end-to-end tests: WebKit, since every iPhone browser is WebKit.
      - run: npx playwright install --with-deps chromium webkit
      # Format check, type check, unit tests, then build and test the built site, in
      # browsers too (leaves dist/).
      - run: npm run test:all
      # The tests build with Placeholders shown; the live site leaves them out, so build it
      # again as it's deployed, and check that build before uploading it.
      - run: npm run build
      - run: npm run test:live
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Any failure in build (including a failing test) skips this job.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

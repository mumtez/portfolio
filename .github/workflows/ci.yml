name: CI

# Every branch and pull request gets the same checks as a deploy; deploying
# stays in deploy.yml, on main only.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browsers for the end-to-end tests: WebKit, since every iPhone browser is WebKit.
      - run: npx playwright install --with-deps chromium webkit
      # Format check, type check, unit tests, then build and test the built site, in
      # browsers too.
      - run: npm run test:all
